name: OnePieceTubeReader
options:
  bundleIdPrefix: at.aaron.onepiece
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  OnePieceTubeReader:
    type: application
    platform: iOS
    sources: [OnePieceTubeReader]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.aaron.onepiece.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OnePieceTubeReader/Info.plist
      properties:
        CFBundleDisplayName: OnePieceTube Reader
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        'UISupportedInterfaceOrientations~ipad': [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [at.aaron.onepiece.ios.refresh]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    dependencies:
      - sdk: PDFKit.framework
      - sdk: BackgroundTasks.framework
  OnePieceTubeReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OnePieceTubeReaderTests]
    dependencies:
      - target: OnePieceTubeReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OnePieceTubeReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OnePieceTubeReaderUITests]
    dependencies:
      - target: OnePieceTubeReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OnePieceTubeReader:
    build:
      targets:
        OnePieceTubeReader: all
    test:
      targets: [OnePieceTubeReaderTests, OnePieceTubeReaderUITests]
